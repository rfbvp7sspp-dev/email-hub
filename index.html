<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A0A0C">
  <title>JP Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ══════════════════════════════════════════════
     INBOX VIEW
══════════════════════════════════════════════ -->
<div class="view active" id="inboxView">

  <header class="app-header">
    <div class="header-badge">
      <!-- envelope icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>
    <div class="header-titles">
      <div class="header-title">JP Hub</div>
      <div class="header-sub">AI Workflow Controller</div>
    </div>
    <div class="header-clock" id="appClock"></div>
  </header>

  <nav class="quick-nav">
    <div class="pick-wrap">
      <button class="quick-btn">&#128193; Open Email</button>
      <input type="file" accept=".json,application/json,text/plain,*/*" id="filePicker">
    </div>
    <button class="quick-btn" onclick="openOneDrive()">OneDrive</button>
    <button class="quick-btn" onclick="openOutlookLink()">Outlook</button>
  </nav>

  <div class="scroll">

    <!-- Recents -->
    <div id="recentSection" style="display:none; flex-direction:column; gap:12px;">
      <div class="section-label">Recent</div>
      <div id="recentList"></div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="empty-title">No Recent Emails</div>
      <div class="empty-desc">Tap "Open Email" above to load an email JSON file from your OneDrive Pending Emails folder.</div>
    </div>

    <!-- Paste fallback -->
    <details class="paste-details">
      <summary class="paste-summary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
        </svg>
        File not opening? Paste JSON instead
      </summary>
      <div class="paste-body">
        <textarea id="pasteInput" placeholder="Paste the contents of the JSON file here..."></textarea>
        <button class="paste-load-btn" onclick="loadPasted()">Load Email</button>
      </div>
    </details>

  </div>
</div>

<!-- ══════════════════════════════════════════════
     EMAIL VIEW
══════════════════════════════════════════════ -->
<div class="view" id="emailView">

  <header class="app-header">
    <button class="back-btn" onclick="goInbox()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Inbox
    </button>
    <div style="flex:1"></div>
  </header>

  <div class="scroll" id="emailScroll"></div>
</div>

<!-- ══════════════════════════════════════════════
     TASKS VIEW
══════════════════════════════════════════════ -->
<div class="view" id="tasksView">

  <header class="app-header">
    <div class="header-badge">
      <!-- checklist icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 11 12 14 22 4"/>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
    </div>
    <div class="header-titles">
      <div class="header-title">Tasks</div>
    </div>
  </header>

  <div class="scroll">
    <div class="task-input-row">
      <input id="newTaskInput" placeholder="Add a task...">
      <button class="add-task-btn" onclick="addTaskManually()">Add</button>
    </div>
    <div class="task-count" id="taskCount"></div>
    <div id="taskList"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     TAB BAR
══════════════════════════════════════════════ -->
<nav class="tab-bar">
  <button class="tab active" id="tab-inbox" onclick="goInbox()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </svg>
    Inbox
  </button>
  <button class="tab" id="tab-tasks" onclick="goTasks()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 11 12 14 22 4"/>
      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
    </svg>
    Tasks
  </button>
</nav>

<!-- ══════════════════════════════════════════════
     TOAST
══════════════════════════════════════════════ -->
<div class="toast" id="toast">
  <span id="toastIcon"></span>
  <span id="toastMsg"></span>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
