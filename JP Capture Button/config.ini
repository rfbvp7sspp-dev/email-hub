; =====================================================================
;  JP Capture Button - configuration
; ---------------------------------------------------------------------
;  Edit this file to change hotkeys, folders, URLs and menu items.
;  Save the file, then right-click the tray icon and choose "Reload"
;  (or just restart the script) for changes to take effect.
;
;  Hotkey syntax (AutoHotkey style):
;     ^ = Ctrl    ! = Alt    + = Shift    # = Windows key
;  Examples:
;     ^!j        = Ctrl + Alt + J
;     #+t        = Win + Shift + T
;     !{Space}   = Alt + Space
; =====================================================================

[Hotkeys]
; The one button that opens the pop-up command centre.
MainMenu=^!j

[Folders]
; Leave BaseFolder blank to use:  Documents\JP Capture Button
BaseFolder=
ScreenshotsSubfolder=Screenshots
ClipboardSavesSubfolder=Clipboard Saves
; Leave DownloadsFolder blank to use your real Downloads folder.
DownloadsFolder=

[Behaviour]
; How long (seconds) to wait for a browser screenshot to land in Downloads.
BrowserCaptureTimeout=20
; Show the first N characters of clipboard text in the preview.
ClipboardPreviewChars=500

[URLs]
Microsoft365=https://www.microsoft365.com
OutlookWeb=https://outlook.office.com/mail
OneDrive=https://onedrive.live.com
SharePoint=https://www.office.com/launch/sharepoint
Copilot365=https://www.microsoft365.com/chat
Teams=https://teams.microsoft.com
ChatGPT=https://chat.openai.com
Claude=https://claude.ai
GitHubCopilot=https://github.com/copilot
VSCodeWeb=https://vscode.dev

[PowerToys]
; These must match whatever you have set inside PowerToys settings.
TextExtractor=#+t
ColorPicker=#+c
FancyZones=#+`
AlwaysOnTop=#^t
Run=!{Space}
